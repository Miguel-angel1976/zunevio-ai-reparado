
name: ZUNEVIO AI - APK y AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  android-build:
    name: Compilar ZUNEVIO AI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Instalar componentes Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Instalando Android SDK..."

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Verificando instalación..."
          sdkmanager --list_installed

      - name: Preparar proyecto Android desde ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="ZUNEVIO_AI_REPARADO (2).zip"

          echo "Buscando archivo del proyecto..."

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No existe $ZIP_FILE"
            echo "Archivos disponibles en el repositorio:"
            ls -la
            exit 1
          fi

          echo "Verificando integridad del ZIP..."
          unzip -t "$ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          mapfile -t WRAPPERS < <(
            find extracted -type f -name gradlew -print
          )

          if [ "${#WRAPPERS[@]}" -ne 1 ]; then
            echo "ERROR: Se esperaba un único gradlew."
            echo "Encontrados: ${#WRAPPERS[@]}"
            printf '%s\n' "${WRAPPERS[@]}"
            exit 1
          fi

          WRAPPER="${WRAPPERS[0]}"
          PROJECT_DIR="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Falta settings.gradle o settings.gradle.kts."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: Falta gradle-wrapper.properties."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Falta gradle-wrapper.jar."
            exit 1
          fi

          chmod +x "$WRAPPER"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyecto preparado correctamente: $PROJECT_DIR"

      - name: Comprobar configuración y compilar APK y AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "===== JAVA ====="
          java -version

          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "===== GRADLE ====="
          ./gradlew --version

          echo "===== LIMPIANDO PROYECTO ====="
          ./gradlew --no-daemon clean

          echo "===== GENERANDO APK DEBUG ====="
          ./gradlew --no-daemon --stacktrace assembleDebug

          echo "===== GENERANDO APK RELEASE ====="
          ./gradlew --no-daemon --stacktrace assembleRelease

          echo "===== GENERANDO AAB RELEASE ====="
          ./gradlew --no-daemon --stacktrace bundleRelease

          echo "COMPILACIÓN COMPLETADA."

      - name: Preparar y verificar APK y AAB
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          mapfile -d '' -t OUTPUT_FILES < <(
            find "$PROJECT_DIR" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -path "*/build/outputs/*" \
              -print0
          )

          if [ "${#OUTPUT_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No se generaron archivos APK o AAB."
            exit 1
          fi

          for FILE in "${OUTPUT_FILES[@]}"; do
            RELATIVE_PATH="${FILE#"$PROJECT_DIR"/}"
            DESTINATION="artifacts/$RELATIVE_PATH"

            mkdir -p "$(dirname "$DESTINATION")"
            cp "$FILE" "$DESTINATION"

            echo "Archivo preparado: $DESTINATION"
          done

          APK_COUNT=$(find artifacts -type f -name "*.apk" | wc -l)
          AAB_COUNT=$(find artifacts -type f -name "*.aab" | wc -l)

          echo "APK encontrados: $APK_COUNT"
          echo "AAB encontrados: $AAB_COUNT"

          if [ "$APK_COUNT" -lt 2 ]; then
            echo "ERROR: No se han generado los APK Debug y Release."
            exit 1
          fi

          if [ "$AAB_COUNT" -lt 1 ]; then
            echo "ERROR: No se ha generado el AAB Release."
            exit 1
          fi

          echo "===== VERIFICANDO INTEGRIDAD ====="

          while IFS= read -r -d '' FILE; do
            unzip -t "$FILE" >/dev/null
            sha256sum "$FILE"
            echo "Integridad correcta: $FILE"
          done < <(
            find artifacts -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print0
          )

          echo "===== ARCHIVOS GENERADOS ====="
          find artifacts -type f -printf '%p (%s bytes)\n'

          echo "TODOS LOS ARCHIVOS HAN SUPERADO LA VERIFICACIÓN."

      - name: Guardar APK y AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZUNEVIO-AI-APK-AAB
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
